name: test

on:
  push:
    branches:
      - master
    paths:
      - src/**
      - tests/**
      - assets/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - assets/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/test.yml

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
